[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "low-light-enhancement"
version = "0.1.0"
description = "Unpaired low-light image enhancement with Zero-DCE"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
  "Pillow>=9.0",
  "numpy>=1.23",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
